name: Publicar Tome Nota News
on:
  push:
    branches:
      - public-site-github-supabase
    paths:
      - "public-site/**"
      - ".github/workflows/public-site.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: https://ppaulomaciel32-cell.github.io/tome/
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Baixar código
        uses: actions/checkout@v6
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar arquivos estáticos
        uses: actions/upload-pages-artifact@v4
        with:
          path: public-site
      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v4
