  if (item.id === 'biblioteca') content = `<div class="library-layout"><section class="upload-empty">${icon('folder')}<h2>Sua biblioteca está sendo preparada</h2><p>Fotos, vídeos, PDFs e textos ficarão reunidos aqui.<br>O envio de arquivos será ativado no próximo marco.</p><button class="button primary" disabled>${icon('plus')}Adicionar material</button><small>Upload ainda indisponível</small></section><aside class="info-card"><p class="eyebrow">ORGANIZAÇÃO LOCAL</p><h2>Cada pauta no seu lugar.</h2><p>Escolha a localidade, adicione tags e acompanhe a situação de cada material.</p><div class="tags">${['São Gonçalo','Pecém','Taíba','Croatá','Paracuru','Região'].map(x=>`<span>${x}</span>`).join('')}</div><div class="quiet-note">${icon('clock')}<p>O histórico mostrará quem enviou o material e quando.</p></div></aside></div>`;
  else if (item.id === 'infraestrutura') content = `<section class="service-list" aria-label="Serviços">${[['Site público','tomezap.com.br'],['Robô de redação','bot.tomezap.com.br'],['Banco e autenticação','Supabase'],['API existente','api.tomezap.com.br'],['Chat existente','chat.tomezap.com.br'],['WhatsApp existente','whats.tomezap.com.br']].map(([title,host])=>`<article><span class="module-icon">${icon('pulse')}</span><div><h2>${title}</h2><p>${host}</p></div>${waiting('Ainda não verificado')}</article>`).join('')}</section><p class="support-note">As consultas automáticas, o histórico de quedas e a conferência dos cabeçalhos serão ativados no marco de infraestrutura. Nenhum serviço foi consultado nesta tela.</p>`;
  else if (item.id === 'dashboard') content = `<section class="empty-card">${icon('grid')}<h2>Os resultados precisam de dados reais.</h2><p>Quando as conexões estiverem ativas, você poderá comparar visitas, matérias, mensagens e campanhas em períodos de 7 ou 30 dias.</p>${waiting('Aguardando dados')}</section>`;
  else if (item.id === 'tracking') content = `<div class="feature-grid">${[['Links de campanha','Crie links com origem, canal e nome da campanha.'],['Origem das visitas','Veja como os leitores chegaram ao jornal.'],['Afiliadas e comissões','Acompanhe cliques e vendas confirmadas.']].map(([t,d])=>`<article class="info-card">${icon('link')}<h2>${t}</h2><p>${d}</p>${waiting()}</article>`).join('')}</div><p class="support-note">Cliques não serão contados como vendas. As comissões dependerão do registro de vendas confirmadas.</p>`;
  else content = `<section class="empty-card"><span class="large-icon">${icon(item.icon)}</span><h2>${item.id === 'whatsapp' ? 'Seu número, conectado com segurança.' : 'Seu perfil profissional, bem acompanhado.'}</h2><p>${item.id === 'whatsapp' ? 'Aqui você verá a conexão oficial, o histórico de mensagens e o teste de envio para um número autorizado.' : 'Aqui você poderá conectar sua conta profissional, preparar posts e carrosséis e acompanhar as métricas liberadas pela Meta.'}</p>${waiting()}<button class="button primary" disabled>Conectar ${item.label}</button><small>A conexão será habilitada no marco deste módulo.</small></section><p class="support-note">${item.id === 'whatsapp' ? 'O uso em grupos depende da elegibilidade da conta e das regras atuais da Meta. Essa validação será feita durante a conexão.' : 'As funções dependem das permissões concedidas pela conta profissional. Tokens não aparecerão nesta tela.'}</p>`;
  return `<div class="page-heading"><div><p class="eyebrow">${item.eyebrow}</p><h1>${item.title}</h1><p>${item.detail}</p></div></div>${content}`;
}
function whatsappPage(preview, user) {
  return `<div class="page-heading"><div><p class="eyebrow">CONVERSA QUE VIRA NOTÍCIA</p><h1>Sua redação, na conversa.</h1><p>Um chip dedicado. Um grupo autorizado. Toda publicação passa pela aprovação de vocês.</p></div></div><div class="feature-grid"><section class="info-card"><span class="module-icon">${icon('chat')}</span><h2>Conexão do WhatsApp</h2><p data-wa-state>${preview ? 'Prévia visual: conexão ainda não verificada.' : 'Consultando a conexão…'}</p><p data-wa-group>O grupo será escolhido depois do pareamento.</p>${preview || user?.role!=='owner' ? '<button class="button primary" disabled>Abrir pareamento</button>' : '<a class="button primary" href="https://bot.tomezap.com.br/conectar">Abrir pareamento ↗</a>'}<p class="support-note">Somente o dono pode ver o QR Code e confirmar o grupo.</p></section><section class="info-card">${icon('shield')}<h2>Aprovação antes de publicar.</h2><p>O robô prepara rascunhos privados com as fontes aprovadas. Confira a fila e leia o texto completo antes da próxima etapa de aprovação.</p>${waiting('Publicação bloqueada')}<p><a class="text-link" href="#rascunhos">Conferir rascunhos ↗</a></p></section></div><div class="quiet-note">${icon('shield')}<p>Conexão não oficial: há risco de bloqueio do número. Use um chip exclusivo para o robô e mantenha poucos envios.</p></div>`;
}
function helpPage() {
  return `<div class="page-heading"><div><p class="eyebrow">SIMPLES, DO COMEÇO AO FIM</p><h1>Seu jeito de produzir notícia.</h1><p>O painel está sendo construído para acompanhar este fluxo.</p></div></div><div class="flow-grid">${[['01','Reúna a pauta','Envie a foto, o texto ou o release e escolha a localidade.','folder'],['02','Produza a matéria','O robô busca fontes e prepara o texto com Gemini.','book'],['03','Aprove no grupo','Confira a prévia. A matéria só será publicada depois de uma aprovação humana.','check'],['04','Compartilhe e aprenda','Distribua a notícia e acompanhe os resultados.','pulse']].map(([n,t,d,i])=>`<article class="info-card"><span class="flow-number">${n}</span>${icon(i)}<h2>${t}</h2><p>${d}</p></article>`).join('')}</div><section class="help-banner"><div>${icon('shield')}<h2>Conexões no seu tempo.</h2><p>Um módulo sem configuração fica em “Aguardando conexão”. As outras áreas continuam acessíveis. O primeiro marco entrega o visual e a estrutura de acesso.</p></div></section>`;
}
function mountShell({root, user = null, preview = false, onLogout = () => {}, whatsappRequest}) {
  root.innerHTML = `<div class="workspace"><aside class="sidebar" id="sidebar"><button class="icon-button menu-close" aria-label="Fechar menu"><span aria-hidden="true">×</span></button><a class="brand" href="#inicio" aria-label="TomeZap, início"><span class="brand-mark">tn</span><span>TomeZap<small>CONTROLE DA REDAÇÃO</small></span></a><p class="nav-label">ESPAÇO DE TRABALHO</p><nav aria-label="Módulos do painel"><a href="#inicio" data-nav="inicio">${icon('grid')}Visão geral</a><a href="#biblioteca" data-nav="biblioteca">${icon('folder')}Biblioteca</a><a href="#rascunhos" data-nav="rascunhos">${icon('book')}Rascunhos</a><p class="nav-label">CANAIS E RESULTADOS</p>${modules.filter(m=>m.id!=='biblioteca').map(m=>`<a href="#${m.id}" data-nav="${m.id}">${icon(m.icon)}${m.label}</a>`).join('')}</nav><div class="sidebar-bottom"><a href="#ajuda" data-nav="ajuda">${icon('help')}Como funciona</a><a href="https://tomezap.com.br" target="_blank" rel="noopener noreferrer">${icon('external')}Abrir o jornal</a><div class="sidebar-edition"><span class="edition-dot"></span>TOME NOTA NEWS<span>CE</span></div></div></aside>
  <div class="workspace-body"><header class="topbar"><div class="breadcrumb"><button class="icon-button menu-toggle" aria-label="Abrir menu" aria-expanded="false" aria-controls="sidebar">${icon('menu')}</button><span>Seu espaço</span>${icon('chevron')}<strong id="breadcrumb-current">Visão geral</strong></div><div class="topbar-end"><span class="topbar-date">${new Intl.DateTimeFormat('pt-BR',{day:'numeric',month:'long',timeZone:'America/Fortaleza'}).format(new Date())}</span><span class="avatar" aria-label="${preview ? 'Prévia visual' : 'Usuário autenticado'}">${preview ? 'TN' : user?.role === 'owner' ? 'DN' : 'ED'}</span><div class="profile-label"><strong>${preview ? 'Sua redação' : user?.role === 'owner' ? 'Dono do painel' : 'Editor'}</strong><small>${preview ? 'Prévia visual' : 'Acesso autorizado'}</small></div><button class="icon-button logout-button" aria-label="${preview ? 'Ver tela de login' : 'Sair do painel'}" title="${preview ? 'Ver tela de login' : 'Sair do painel'}">${icon('logout')}</button></div></header>
  <div class="stage-notice">${icon(preview ? 'eye' : 'clock')}<span>${preview ? '<strong>Prévia visual.</strong> Navegue pelos módulos. Nenhum dado real é consultado ou publicado.' : '<strong>Redação em preparação.</strong> Rascunhos privados; publicação ainda bloqueada.'}</span>${preview ? '<a href="./">Ir para o login</a>' : ''}</div>
  <main id="main" tabindex="-1"></main><footer class="workspace-footer"><span>TomeZap <span class="footer-dot">·</span> Tome Nota News</span><span>Feito para a sua redação, no Ceará.</span></footer></div></div>`;
  const main = root.querySelector('#main'), sidebar = root.querySelector('.sidebar'), menu = root.querySelector('.menu-toggle');
  function closeMenu() {sidebar.classList.remove('open'); menu.setAttribute('aria-expanded','false');}
  menu.addEventListener('click', () => {const open = sidebar.classList.toggle('open'); menu.setAttribute('aria-expanded',String(open)); if (open) (sidebar.querySelector('[aria-current=page]') || sidebar.querySelector('a')).focus();});
  root.querySelector('.menu-close').addEventListener('click', () => {closeMenu(); menu.focus();});
  const onKey = event => {if (event.key === 'Escape') {closeMenu(); menu.focus();}};
  root.addEventListener('keydown', onKey);
  const draw = (focus = false) => {
    const id = location.hash.slice(1) || 'inicio';
    const item = modules.find(m=>m.id===id);
    const detail=id.match(/^rascunho\/([a-f0-9]{8}-[a-f0-9]{4}-4[a-f0-9]{3}-[89ab][a-f0-9]{3}-[a-f0-9]{12})$/);
    const isDraft=id==='rascunhos' || Boolean(detail);
    const resolved = isDraft ? 'rascunhos' : item ? id : id === 'ajuda' ? 'ajuda' : 'inicio';
    main.innerHTML = isDraft ? (preview ? (detail ? draftDetail(null,true) : draftList({},true)) : '<section class="empty-card"><h1>Conferindo seus rascunhos…</h1><p role="status">Carregando o conteúdo privado.</p></section>') : resolved === 'inicio' ? overview() : resolved === 'ajuda' ? helpPage() : resolved === 'whatsapp' ? whatsappPage(preview,user) : modulePage(item);
    if(isDraft && !preview && whatsappRequest){
      const target=main.firstElementChild;
      whatsappRequest('/drafts'+(detail?'/'+detail[1]:'' )).then(data=>{
        if(!target.isConnected)return;
        main.innerHTML=detail?draftDetail(data):draftList(data);
      }).catch(error=>{
        if(!target.isConnected)return;
        main.innerHTML='<section class="empty-card"><h1>Rascunhos aguardando conexão.</h1><p role="status"></p><a class="text-link" href="#whatsapp">Conferir o WhatsApp</a></section>';
        main.querySelector('[role=status]').textContent=error.message;
      });
    }
    if(resolved==='whatsapp' && !preview && whatsappRequest){
      const target=main.querySelector('[data-wa-state]'), group=main.querySelector('[data-wa-group]');
      whatsappRequest('/whatsapp/status').then(data=>{if(!target.isConnected)return;target.textContent=data.connected?'Chip conectado.':'Conexão pendente. Abra o pareamento para conferir.';group.textContent=data.group?'Grupo confirmado: '+data.group.name:'O grupo ainda precisa ser confirmado.';}).catch(error=>{if(target.isConnected)target.textContent=error.message;});
    }
    root.querySelector('#breadcrumb-current').textContent = item?.label || (isDraft ? 'Rascunhos' : resolved === 'ajuda' ? 'Como funciona' : 'Visão geral');
    root.querySelectorAll('[data-nav]').forEach(a=>{if (a.dataset.nav === resolved) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current');});
    document.title = `${item?.label || (isDraft ? 'Rascunhos' : resolved === 'ajuda' ? 'Como funciona' : 'Visão geral')} · TomeZap`;
    closeMenu();
    if (focus) {main.focus({preventScroll:true}); window.scrollTo({top:0,behavior:'instant'});}
  };
  const hashChange = () => draw(true);
  window.addEventListener('hashchange', hashChange);
  root.querySelector('.logout-button').addEventListener('click', onLogout);
  draw();
  return () => {window.removeEventListener('hashchange', hashChange); root.removeEventListener('keydown', onKey);};
}

function mountLogin(root, {message = '', onSubmit}) {
  root.innerHTML = `<div class="login-layout"><aside class="login-story"><a class="brand" href="https://tomezap.com.br"><span class="brand-mark">tn</span><span>TomeZap<small>CONTROLE DA REDAÇÃO</small></span></a><div class="login-story-content"><p class="light-eyebrow">JORNALISMO DA NOSSA TERRA</p><h2>Boas histórias.<br>Uma redação<br>mais conectada.</h2><p>Organize suas pautas, acompanhe os canais<br>e cuide do seu jornal em um só lugar.</p><div class="login-localities"><span>São Gonçalo</span><span>Pecém</span><span>Taíba</span><span>Croatá</span><span>Paracuru</span><span>Região</span></div></div><div class="login-story-footer"><span>TOME NOTA NEWS</span><span>CEARÁ, BRASIL</span></div></aside>
  <main id="main" class="login-main"><a class="back-to-site" href="https://tomezap.com.br">Voltar para o jornal ${icon('external')}</a><div class="login-form-wrap"><div class="login-lock">${icon('lock')}</div><p class="eyebrow">SEU ESPAÇO DE TRABALHO</p><h1>Entre na redação.</h1><p class="login-intro">Use a conta autorizada para acessar seu painel.</p><form id="login-form"><label for="email">E-mail</label><input id="email" name="email" type="email" autocomplete="username" required maxlength="254" placeholder="seu@email.com" inputmode="email"><label for="password">Senha</label><div class="password-field"><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="1024" placeholder="Sua senha de acesso"><button class="password-toggle" type="button" aria-label="Mostrar senha" aria-pressed="false">${icon('eye')}</button></div><p id="login-message" class="login-message" role="status" aria-live="polite">${escapeHTML(message)}</p><button class="button primary login-submit" type="submit">Entrar no painel ${icon('arrow')}</button></form><p class="access-note">${icon('shield')}Acesso exclusivo para o dono e os editores autorizados.</p><details class="login-help"><summary>É seu primeiro acesso?</summary><p>O e-mail precisa estar cadastrado e confirmado no acesso do projeto. A senha deste painel é a dessa conta, não a senha do Gmail. A ativação será orientada antes da publicação.</p></details><a class="preview-link" href="./preview.html">Conhecer o visual do painel ${icon('arrow')}</a></div><p class="login-bottom">Uma rotina mais simples. Um jornal mais próximo.</p></main></div>`;
  const form = root.querySelector('#login-form'), password = form.querySelector('#password'), toggle = form.querySelector('.password-toggle');
  toggle.addEventListener('click', () => {const visible = password.type === 'password'; password.type = visible ? 'text' : 'password'; toggle.setAttribute('aria-pressed', String(visible)); toggle.setAttribute('aria-label', visible ? 'Ocultar senha' : 'Mostrar senha');});
  form.addEventListener('submit', async event => {
    event.preventDefault();
    const button = form.querySelector('.login-submit'), status = form.querySelector('#login-message');
    button.disabled = true; button.textContent = 'Verificando acesso…'; status.textContent = ''; form.setAttribute('aria-busy','true');
    try {await onSubmit(form.email.value, password.value);}
    catch (error) {status.textContent = error.message || 'Não foi possível entrar. Tente novamente.';}
    finally {password.value = ''; button.disabled = false; button.innerHTML = 'Entrar no painel ' + icon('arrow'); form.removeAttribute('aria-busy');}
  });
}


const root = document.getElementById('app');
let cleanup = () => {};
function showLogin() {
  cleanup(); cleanup = () => {};
  mountLogin(root, {message:'Prévia visual: este formulário não envia dados.', onSubmit:async () => {throw Error('Prévia visual. O login real depende da ativação do servidor.');}});
  window.scrollTo(0,0);
}
function showShell() {
  cleanup(); cleanup = mountShell({root, preview:true, onLogout:showLogin});
}
root.addEventListener('click', event => {
  const link = event.target.closest('a');
  if (!link) return;
  if (link.classList.contains('preview-link')) {event.preventDefault(); showShell();}
  if (link.getAttribute('href') === './') {event.preventDefault(); showLogin();}
});
showShell();
</script></body></html>
