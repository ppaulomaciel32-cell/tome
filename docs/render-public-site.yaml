# Isolated configuration for the public static service only.
# Do not import the repository's existing render.yaml or create another service.
# Target configuration: activate after the custom domain resolves and has TLS.
services:
  - type: web
    runtime: static
    name: tome-nota-publico
    repo: https://github.com/ppaulomaciel32-cell/tome
    branch: public-site-github-supabase
    buildCommand: node scripts/build-public-site.mjs
    staticPublishPath: dist-public
    autoDeployTrigger: commit
    domains:
      - tomezap.com.br
      - www.tomezap.com.br
    envVars:
      - key: SITE_URL
        value: https://tomezap.com.br
      - key: NODE_VERSION
        value: "22"
      - key: SKIP_INSTALL_DEPS
        value: "true"
    headers:
      - path: /*
        name: X-Frame-Options
        value: "DENY"
      - path: /*
        name: X-Content-Type-Options
        value: "nosniff"
      - path: /*
        name: Referrer-Policy
        value: "strict-origin-when-cross-origin"
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=()"
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://*.supabase.co https://pagead2.googlesyndication.com https://fundingchoicesmessages.google.com https://googleads.g.doubleclick.net https://tpc.googlesyndication.com; style-src 'self' 'unsafe-inline'; connect-src 'self' https://bot.tomezap.com.br https://*.supabase.co https://www.googletagmanager.com https://*.google-analytics.com https://*.analytics.google.com https://pagead2.googlesyndication.com https://fundingchoicesmessages.google.com https://googleads.g.doubleclick.net https://tpc.googlesyndication.com; frame-src 'self' https://*.supabase.co https://pagead2.googlesyndication.com https://fundingchoicesmessages.google.com https://googleads.g.doubleclick.net https://tpc.googlesyndication.com; img-src 'self' data: https:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

      - path: /admin/*
        name: Cache-Control
        value: "no-store"
      - path: /admin/*
        name: X-Robots-Tag
        value: "noindex, nofollow, noarchive"
      - path: /admin/*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src https://bot.tomezap.com.br; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
