# Load inside the existing nginx http context, as a separate site configuration.
# Prerequisite: DNS resolves to this VPS and the certificate files already exist.
# Adjust certificate paths to the host's existing certificate manager.
# Never replace api/chat/default site configurations with this file.
limit_req_zone $binary_remote_addr zone=tnn_news_webhook:10m rate=10r/s;
upstream tnn_news_bot { server 127.0.0.1:18080; }

server {
    listen 80;
    server_name bot.tomezap.com.br;
    location / { return 308 https://bot.tomezap.com.br$request_uri; }
}

server {
    listen 443 ssl;
    server_name bot.tomezap.com.br;
    ssl_certificate /etc/letsencrypt/live/bot.tomezap.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bot.tomezap.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 256k;
    client_body_timeout 10s;
    server_tokens off;
    access_log off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 10s;

    location = /webhook {
        limit_req zone=tnn_news_webhook burst=30 nodelay;
        proxy_pass http://tnn_news_bot;
    }
    location /preview/ { proxy_pass http://tnn_news_bot; }
    location = /healthz { proxy_pass http://tnn_news_bot; }
    location / { return 404; }
}
