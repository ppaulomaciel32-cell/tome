limit_req_zone $binary_remote_addr zone=tnn_webhook:10m rate=10r/s;
upstream tnn_bot { server bot-whatsapp:8080; }
server {
    listen 80;
    server_name _;
    location = /healthz { proxy_pass http://tnn_bot; }
    location / { return 308 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name _;
    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 256k;
    client_body_timeout 10s;
    server_tokens off;
    access_log off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location = /webhook {
        limit_req zone=tnn_webhook burst=30 nodelay;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://tnn_bot;
        proxy_read_timeout 10s;
    }
    location /preview/ { proxy_pass http://tnn_bot; }
    location = /healthz { proxy_pass http://tnn_bot; }
    location / { return 404; }
}
