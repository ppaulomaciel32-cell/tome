# Usar junto de docker-compose.yml, no projeto tomezap-painel.
# Não sobe o agente Python antigo nem altera os volumes dele.
services:
  whatsapp:
    build: ../whatsapp-bridge
    env_file: ../whatsapp-bridge/.env
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    volumes:
      - type: bind
        source: /opt/tome-news/sessao-wa
        target: /data/session
        bind:
          create_host_path: false
      # Fotos das pautas, só até a redação buscar. Nunca exposto pelo nginx.
      - type: bind
        source: /opt/tome-news/imagens/entrada
        target: /data/media
        bind:
          create_host_path: false
    environment:
      WA_MEDIA_DIR: /data/media
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # Porta disponível apenas na rede Docker: sem ports, Redis ou acesso público.
    expose: ['3090']
    deploy:
      resources:
        limits: {cpus: '1.0', memory: 384M}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3090/livez').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: '5m', max-file: '2'}
