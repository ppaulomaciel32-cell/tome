# Projeto separado: não reinicia o bot, Redis ou serviços existentes.
name: tomezap-painel
services:
  painel-api:
    build: .
    env_file: .env
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    ports: ["127.0.0.1:18081:3080"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits: {cpus: '0.5', memory: 128M}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
