# ADICIONAR somente dentro do server HTTPS já existente de bot.tomezap.com.br.
# Não substituir o server: /webhook, /preview/ e /healthz do bot permanecem.
# Aplicar apenas após autorização; nginx -t antes de qualquer reload.
location ^~ /painel-api/ {
    proxy_pass http://127.0.0.1:18081;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Connection "";
    proxy_http_version 1.1;
    proxy_read_timeout 25s;
    client_max_body_size 8k;
    client_body_timeout 10s;
    access_log off;
}
# A página e seus arquivos são servidos pela API, que exige sessão de dono.
# /healthz continua apontando para o bot existente nesta primeira etapa.
location = /conectar {
    proxy_pass http://127.0.0.1:18081;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    access_log off;
}
location ^~ /conectar/ {
    proxy_pass http://127.0.0.1:18081;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    access_log off;
}
